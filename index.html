<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AION</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0f172a">
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            width: 100%;
            max-width: 600px;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            border-bottom: 1px solid #1e293b;
            padding-bottom: 12px;
        }
        h1 {
            color: #f59e0b;
            margin: 0;
            font-size: 24px;
            letter-spacing: 2px;
        }
        .btn-config {
            background: transparent;
            border: 1px solid #334155;
            color: #94a3b8;
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
        }
        .btn-config:hover {
            border-color: #f59e0b;
            color: #f59e0b;
        }
        #config-panel {
            background: #1e293b;
            padding: 16px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: none;
            border: 1px solid #334155;
        }
        input[type="password"], input[type="text"] {
            width: 100%;
            padding: 10px;
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 6px;
            color: #fff;
            box-sizing: border-box;
            margin-bottom: 10px;
        }
        button.primary {
            background: #0ea5e9;
            color: white;
            border: none;
            padding: 10px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            width: 100%;
        }
        button.primary:hover {
            background: #0284c7;
        }
        .search-box {
            margin-bottom: 20px;
        }
        #result-box {
            background: #1e293b;
            border-radius: 8px;
            padding: 16px;
            display: none;
            border: 1px solid #334155;
            line-height: 1.6;
        }
        .sources {
            margin-top: 16px;
            font-size: 13px;
            border-top: 1px solid #334155;
            padding-top: 12px;
        }
        .sources a {
            color: #38bdf8;
            text-decoration: none;
            display: block;
            margin-bottom: 4px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .sources a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>AION</h1>
            <button class="btn-config" onclick="toggleConfig()">Clé API</button>
        </header>

        <div id="config-panel">
            <input type="password" id="api-key-input" placeholder="Entrez votre clé Tavily (tvly-...)">
            <button class="primary" onclick="saveKey()">Sauvegarder localement</button>
        </div>

        <div class="search-box">
            <input type="text" id="query-input" placeholder="Posez votre question à AION...">
            <button class="primary" onclick="runAionSearch()">Lancer l'investigation</button>
        </div>

        <div id="result-box">
            <div id="answer-text"></div>
            <div class="sources" id="sources-list"></div>
        </div>
    </div>

    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js');
        }

        function toggleConfig() {
            const panel = document.getElementById('config-panel');
            panel.style.display = panel.style.display === 'block' ? 'none' : 'block';
        }

        function saveKey() {
            const key = document.getElementById('api-key-input').value.trim();
            if (key) {
                localStorage.setItem('aion_tavily_key', key);
                alert('Clé enregistrée en toute sécurité sur votre appareil.');
                toggleConfig();
            }
        }

        async function runAionSearch() {
            const apiKey = localStorage.getItem('aion_tavily_key');
            if (!apiKey) {
                alert('Veuillez d\'abord configurer votre clé API Tavily via le bouton en haut à droite.');
                toggleConfig();
                return;
            }

            const queryInput = document.getElementById('query-input').value.trim();
            if (!queryInput) return;

            const resultBox = document.getElementById('result-box');
            const answerText = document.getElementById('answer-text');
            const sourcesList = document.getElementById('sources-list');

            resultBox.style.display = 'block';
            answerText.innerText = 'Investigation en cours...';
            sourcesList.innerHTML = '';

            try {
                // On force la consigne de langue directement dans la requête
                const response = await fetch('https://api.tavily.com/search', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        api_key: apiKey,
                        query: queryInput + " Réponds en français de manière claire et détaillée.",
                        search_depth: "advanced",
                        include_answer: true,
                        max_results: 5
                    })
                });

                const data = await response.json();
                answerText.innerText = data.answer || "Aucune réponse générée.";

                if (data.results && data.results.length > 0) {
                    sourcesList.innerHTML = '<strong>Sources mobilisées :</strong><br>';
                    data.results.forEach(item => {
                        sourcesList.innerHTML += `<a href="${item.url}" target="_blank">• ${item.title}</a>`;
                    });
                }
            } catch (error) {
                answerText.innerText = "Erreur de connexion avec l'API.";
            }
        }
    </script>
</body>
</html>
